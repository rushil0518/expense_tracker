<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Expense Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            background-color: #ffffff;
            padding-top: 30px;
            box-shadow: 2px 0 15px rgba(0,0,0,0.05);
            position: fixed;
        }

        .sidebar a {
            display: block;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 500;
            color: #444;
            text-decoration: none;
        }

        .sidebar a:hover, .active-link {
            background: #eef2ff;
            color: #4f46e5 !important;
            border-radius: 8px;
        }

        .main {
            margin-left: 260px;
            padding: 25px;
        }

        .card-box {
            border-radius: 16px;
            padding: 25px;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card-title {
            font-size: 15px;
            color: #555;
        }

        .card-value {
            font-size: 26px;
            font-weight: 700;
            color: #111;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h4 class="text-center fw-bold mb-4">Expense Tracker</h4>

        <a href="dashboard.html" class="active-link"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
        <a href="expenses.html"><i class="bi bi-cash-stack me-2"></i> Expenses</a>
        <a href="categories.html"><i class="bi bi-tags me-2"></i> Categories</a>
        <a href="budget.html"><i class="bi bi-wallet2 me-2"></i> Budget</a>
        <a href="analytics.html"><i class="bi bi-bar-chart-line me-2"></i> Analytics</a>

        <hr>

        <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main">
        <h2 class="fw-bold mb-4">Dashboard</h2>

        <div class="row g-4">

            <!-- Card 1: Today's Spending -->
            <div class="col-md-4">
                <div class="card-box">
                    <div class="card-title">Today’s Spending</div>
                    <div id="todaySpending" class="card-value">₹0</div>
                </div>
            </div>

            <!-- Card 2: This Month Spending -->
            <div class="col-md-4">
                <div class="card-box">
                    <div class="card-title">This Month Spending</div>
                    <div id="monthSpending" class="card-value">₹0</div>
                </div>
            </div>

            <!-- Card 3: Total Expenses -->
            <div class="col-md-4">
                <div class="card-box">
                    <div class="card-title">Total Expenses</div>
                    <div id="totalExpenses" class="card-value">0</div>
                </div>
            </div>

            <!-- Card 4: Top Category -->
            <div class="col-md-6">
                <div class="card-box">
                    <div class="card-title">Top Category</div>
                    <div id="topCategory" class="card-value">No data</div>
                </div>
            </div>

            <!-- Card 5: Budget Summary -->
            <div class="col-md-6">
                <div class="card-box">
                    <div class="card-title">Remaining Budget</div>
                    <div id="budgetRemaining" class="card-value">₹0</div>
                    <small id="budgetInfo" class="text-muted"></small>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script>
        
        const token = localStorage.getItem("access_token");

        if (!token) {
            window.location.href = "index.html";
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        // Fetch Dashboard Data
        async function loadDashboard() {
            const today = new Date().toISOString().split("T")[0];
            const month = new Date().toISOString().slice(0, 7);

            // 1. Expenses data
            const res = await fetch(`${API_BASE}/api/expenses/`, {
                headers: { Authorization: "Bearer " + token }
            });
            const expenses = await res.json();

            let todaySpent = 0;
            let monthSpent = 0;
            let totalCount = expenses.length;
            let categoryTotals = {};

            expenses.forEach(exp => {
                const expDate = exp.date.split("T")[0];
                const expMonth = exp.date.slice(0, 7);

                // Today
                if (expDate === today) todaySpent += exp.amount;

                // Month
                if (expMonth === month) monthSpent += exp.amount;

                // Category totals
                categoryTotals[exp.category] = (categoryTotals[exp.category] || 0) + exp.amount;
            });

            // Top category
            const topCat = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1])[0];

            document.getElementById("todaySpending").textContent = "₹" + todaySpent;
            document.getElementById("monthSpending").textContent = "₹" + monthSpent;
            document.getElementById("totalExpenses").textContent = totalCount;
            document.getElementById("topCategory").textContent = topCat ? topCat[0] : "No data";

            // 2. Budget
            const res2 = await fetch(`${API_BASE}/api/budgets/`, {
                headers: { Authorization: "Bearer " + token }
            });
            const bd = await res2.json();

            const totalBudget = bd.total_budget || 0;
            const totalSpent = bd.total_spent || 0;
            const remaining = totalBudget - totalSpent;

            document.getElementById("budgetRemaining").textContent = "₹" + remaining;
            document.getElementById("budgetInfo").textContent = `Budget: ₹${budget} | Spent: ₹${monthSpent}`;
        }

        loadDashboard();
    </script>

</body>
</html>
