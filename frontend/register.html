<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">

                <div class="card shadow-lg border-0 rounded-4 p-4">
                    <h3 class="text-center mb-3 fw-bold">Create Account</h3>

                    <div id="regError" class="alert alert-danger d-none"></div>
                    <div id="regSuccess" class="alert alert-success d-none"></div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input id="regUsername" type="text" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input id="regPassword" type="password" class="form-control">
                    </div>

                    <button id="regBtn" class="btn btn-primary w-100 fw-semibold">Register</button>

                    <p class="text-center mt-3">
                        Already have an account?
                        <a href="index.html">Login here</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.getElementById("regBtn").addEventListener("click", async function () {
            const username = document.getElementById("regUsername").value.trim();
            const password = document.getElementById("regPassword").value.trim();

            const response = await fetch("http://127.0.0.1:8000/api/register/", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, password})
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById("regSuccess").classList.remove("d-none");
                document.getElementById("regSuccess").innerText = "Account created successfully! Redirecting...";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);
            } else {
                document.getElementById("regError").classList.remove("d-none");
                document.getElementById("regError").innerText = data.username || "Invalid input";
            }
        });
    </script>

</body>
</html>
