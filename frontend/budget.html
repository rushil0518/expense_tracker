<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Budget - Expense Tracker</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background: #f5f7fa; font-family: "Inter", sans-serif; }
    .sidebar { width: 240px; height: 100vh; background:#fff; padding-top:30px; position:fixed; box-shadow:2px 0 15px rgba(0,0,0,0.05); }
    .sidebar a { display:block; padding:12px 25px; color:#444; font-size:15px; font-weight:500; text-decoration:none; }
    .sidebar a:hover, .active-link { background:#eef2ff; color:#4f46e5 !important; border-radius:8px; }
    .main { margin-left:260px; padding:30px; }
    .stat-value { font-weight:700; font-size:1.6rem; }
    .muted { color:#6b7280; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h4 class="text-center fw-bold mb-4">Expense Tracker</h4>
    <a href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
    <a href="expenses.html"><i class="bi bi-cash-stack me-2"></i> Expenses</a>
    <a href="categories.html"><i class="bi bi-tags me-2"></i> Categories</a>
    <a href="budget.html" class="active-link"><i class="bi bi-wallet2 me-2"></i> Budget</a>
    <a href="analytics.html"><i class="bi bi-bar-chart-line me-2"></i> Analytics</a>

    <hr>
    <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">Monthly Budget</h2>
      <button class="btn btn-primary" onclick="openBudgetModal()">
        <i class="bi bi-pencil-square me-1"></i> Add / Update Budget
      </button>
    </div>

    <div id="alertPlaceholder"></div>

    <div class="card shadow-sm p-4">
      <div class="row align-items-center">
        <div class="col-md-4">
          <div class="muted">Budget (this month)</div>
          <div id="totalBudget" class="stat-value">₹0</div>
        </div>

        <div class="col-md-4">
          <div class="muted">Total Spent (this month)</div>
          <div id="totalSpent" class="stat-value">₹0</div>
        </div>

        <div class="col-md-4">
          <div class="muted">Remaining</div>
          <div id="remainingAmount" class="stat-value">₹0</div>
        </div>
      </div>

      <div class="mt-4">
        <div class="d-flex justify-content-between mb-2">
          <div class="muted">Budget usage</div>
          <div id="progressLabel" class="muted">0%</div>
        </div>

        <div class="progress" style="height:18px">
          <div id="budgetProgress" class="progress-bar" role="progressbar" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Budget Modal -->
  <div class="modal fade" id="budgetModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Set Monthly Budget</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Budget amount (₹)</label>
          <input id="budgetAmount" type="number" class="form-control" min="0" placeholder="Enter amount">
          <small class="text-muted">This sets a single budget for the current month.</small>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button id="saveBudgetBtn" type="button" class="btn btn-success" onclick="saveBudget()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_BASE = "http://127.0.0.1:8000/api";
    const token = localStorage.getItem("access_token");
    if (!token) {
      // no token -> force login
      window.location.href = "index.html";
    }

    function logout() {
      localStorage.clear();
      window.location.href = "index.html";
    }

    function showAlert(message, type = "success", timeout = 3000) {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>`;
      const ph = document.getElementById('alertPlaceholder');
      ph.innerHTML = "";
      ph.append(wrapper);
      if (timeout) setTimeout(()=> { bootstrap.Alert.getOrCreateInstance(wrapper.querySelector('.alert')).close(); }, timeout);
    }

    function openBudgetModal() {
      const modal = new bootstrap.Modal(document.getElementById('budgetModal'));
      // prefill with current budget amount
      const current = document.getElementById('totalBudget').textContent.replace(/[^\d.-]/g,'');
      document.getElementById('budgetAmount').value = current && Number(current) > 0 ? current : '';
      modal.show();
    }

    async function loadBudget() {
      try {
        const res = await fetch(`${API_BASE}/budgets/`, {
          headers: { "Authorization": "Bearer " + token }
        });

        if (!res.ok) {
          // 404 or similar -> show empty budget (no crash)
          console.warn('Budget GET returned', res.status);
          updateUI(0, 0);
          return;
        }

        const data = await res.json();
        // expected response: { total_budget: number, total_spent: number }
        const total_budget = Number(data.total_budget || 0);
        const total_spent = Number(data.total_spent || 0);

        updateUI(total_budget, total_spent);
      } catch (err) {
        console.error("Failed to load budget:", err);
        showAlert("Failed to fetch budget. Check backend.", "danger", 5000);
        updateUI(0,0);
      }
    }

    function updateUI(total_budget, total_spent) {
      const remaining = Math.max(0, total_budget - total_spent);

      document.getElementById('totalBudget').textContent = "₹" + total_budget.toLocaleString();
      document.getElementById('totalSpent').textContent = "₹" + total_spent.toLocaleString();
      document.getElementById('remainingAmount').textContent = "₹" + remaining.toLocaleString();

      let percent = 0;
      if (total_budget > 0) {
        percent = Math.round((total_spent / total_budget) * 100);
        if (percent < 0) percent = 0;
      }
      percent = Math.min(percent, 100);

      // update progress bar width and color
      const bar = document.getElementById('budgetProgress');
      bar.style.width = percent + "%";
      bar.className = "progress-bar"; // reset classes

      if (percent < 60) {
        bar.classList.add("bg-success");
      } else if (percent < 90) {
        bar.classList.add("bg-warning");
      } else {
        bar.classList.add("bg-danger");
      }

      document.getElementById('progressLabel').textContent = percent + "%";
    }

    async function saveBudget() {
      const btn = document.getElementById('saveBudgetBtn');
      btn.disabled = true;
      const raw = document.getElementById('budgetAmount').value;
      const amount = raw === "" ? 0 : Number(raw);

      try {
        const res = await fetch(`${API_BASE}/budgets/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ amount })
        });

        if (!res.ok) {
          const err = await res.text();
          console.error("Budget POST failed", res.status, err);
          showAlert("Failed to save budget.", "danger", 5000);
          return;
        }

        const data = await res.json();
        showAlert(data.message || "Budget saved.", "success", 2000);
        // close modal
        bootstrap.Modal.getOrCreateInstance(document.getElementById('budgetModal')).hide();
        // reload
        await loadBudget();
      } catch (err) {
        console.error("Error saving budget:", err);
        showAlert("Error saving budget. Check server.", "danger", 5000);
      } finally {
        btn.disabled = false;
      }
    }

    // initial load
    loadBudget();
  </script>
</body>
</html>
