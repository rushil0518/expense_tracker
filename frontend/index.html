<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Login</title>

    <!-- Bootstrap + Icons + Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="bg-light d-flex align-items-center" style="height: 100vh; font-family: 'Inter', sans-serif;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">

                <div class="card shadow-lg border-0 rounded-4 p-4">
                    <h3 class="text-center mb-3 fw-bold">Expense Tracker</h3>
                    <p class="text-center text-muted">Login to continue</p>

                    <div id="loginError" class="alert alert-danger d-none"></div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input id="username" type="text" class="form-control" placeholder="Enter your username">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input id="password" type="password" class="form-control" placeholder="Enter your password">
                    </div>

                    <button id="loginBtn" class="btn btn-primary w-100 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </button>
                    <p class="text-center mt-3">
                        <p class="text-center mt-3">
  Don't have an account?
  <a href="register.html" class="fw-semibold">Create one</a>
</p>

                </div>

            </div>
        </div>
    </div>
    <script src="config.js"></script>

    <script>
        
        document.getElementById("loginBtn").addEventListener("click", async function () {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            const response = await fetch(`${API_BASE}/api/token/`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, password})
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem("access_token", data.access);
                localStorage.setItem("refresh_token", data.refresh);
                window.location.href = "dashboard.html";
            } else {
                document.getElementById("loginError").classList.remove("d-none");
                document.getElementById("loginError").innerText = data.detail || "Invalid credentials";
            }
        });
    </script>

</body>
</html>
